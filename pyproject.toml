[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-resource-crawler"
version = "3.0.0"
description = "网页资源采集器 — 并发下载网页中的图片/CSS/JS/视频/字体等资源"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "web-crawler contributors" }]
requires-python = ">=3.10"
dependencies = [
    # 纯标准库实现，无需外部依赖
]
optional-dependencies = { crypto = ["pycryptodome>=3.20"] }

[project.scripts]
web-crawler = "app.crawler:main"
web-crawler-ui = "app.ui:main"

[tool.setuptools.packages.find]
include = ["app*"]
