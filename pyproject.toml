[project]
name = "web-crawler"
version = "0.3.0"
description = "A Scrapling-aligned stealth web scraping library: adaptive selectors, TLS-fingerprint HTTP, JS rendering, and a spider framework."
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "web-crawler contributors"}]
keywords = [
    "web-scraping",
    "scraping",
    "automation",
    "browser-automation",
    "data-extraction",
    "html-parsing",
    "undetectable",
    "playwright",
    "web-crawler",
    "crawling",
    "headless",
    "scraper",
    "chrome",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: HTML",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "cssselect>=1.2",
]

[project.urls]
Homepage = "https://github.com/xiaomaozjj666/web-crawler"
Repository = "https://github.com/xiaomaozjj666/web-crawler"
Documentation = "https://github.com/xiaomaozjj666/web-crawler#readme"
Changelog = "https://github.com/xiaomaozjj666/web-crawler/blob/main/CHANGELOG.md"
Issues = "https://github.com/xiaomaozjj666/web-crawler/issues"

[project.scripts]
web-crawler = "app.crawler:main"
crawler-ui = "app.ui:main"
web-crawler-mcp = "web_crawler.mcp.server:main"
web-crawler-reverse = "web_crawler.mcp.cli:main"

[project.optional-dependencies]
visual = [
    "Pillow>=10.0",
]
all = [
    "curl_cffi>=0.9",
    "playwright>=1.40",
    "pydantic>=2.5",
]
camoufox = [
    "camoufox[geoip]>=0.4.4",
]
captcha = [
    "ddddocr>=1.5",
    "numpy>=1.26",
]
crypto = [
    "pycryptodome>=3.20",
]
mcp = [
    "mcp>=1.0",
    "camoufox[geoip]>=0.4.4",
    "pydantic>=2.5",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "mypy>=1.10",
    "types-beautifulsoup4>=4.12",
    "pydantic>=2.5",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
ignore = [
    "S110",   # try-except-pass 是 best-effort 清理的合理模式
    "S112",   # try-except-continue 同上
    "BLE001", # blind except 已有模式
    "RUF012", # mutable class default 是 dataclass 风格的合理用法
    "PYI034", # __enter__ 返回 Self 不兼容 3.10
    "PYI046", # 未使用的 Protocol 不影响功能
    "SIM102", # 嵌套 if 可读性更好
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    # close() 同步路径用临时事件循环清理 async 句柄时，AsyncMock 协程
    # 未被完整 await 触发的告警，属于 mock 限制而非源码问题
    "ignore::RuntimeWarning:web_crawler.fetchers.dynamic",
]

[tool.coverage.run]
source = ["app"]
branch = false

[tool.coverage.report]
show_missing = true

[tool.mypy]
# 类型检查目标 Python 3.12（CI 镜像与本地均 >=3.12，且现代 stub 如 numpy 2.5
# 已使用 PEP 695 type 语句，python_version<3.12 会触发 syntax 错误）。
# requires-python 仍保持 ">=3.10"，运行期兼容性由测试套件保障。
python_version = "3.12"
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["web_crawler*", "app*"]
