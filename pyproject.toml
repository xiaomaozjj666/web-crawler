[project]
name = "web-crawler"
version = "0.2.0"
description = "A Scrapling-aligned stealth web scraping library: adaptive selectors, TLS-fingerprint HTTP, JS rendering, and a spider framework."
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "web-crawler contributors"}]
keywords = [
    "web-scraping",
    "scraping",
    "automation",
    "browser-automation",
    "data-extraction",
    "html-parsing",
    "undetectable",
    "playwright",
    "web-crawler",
    "crawling",
    "headless",
    "scraper",
    "chrome",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: HTML",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    "cssselect>=1.2",
]

[project.urls]
Homepage = "https://github.com/xiaomaozjj666/web-crawler"
Repository = "https://github.com/xiaomaozjj666/web-crawler"
Documentation = "https://github.com/xiaomaozjj666/web-crawler#readme"
Changelog = "https://github.com/xiaomaozjj666/web-crawler/blob/main/CHANGELOG.md"
Issues = "https://github.com/xiaomaozjj666/web-crawler/issues"

[project.scripts]
web-crawler = "app.crawler:main"
crawler-ui = "app.ui:main"

[project.optional-dependencies]
all = [
    "curl_cffi>=0.7",
    "playwright>=1.40",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-beautifulsoup4>=4.12",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
