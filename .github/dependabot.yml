version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # 只开 PR 不自动合并；版本上界由 pyproject.toml 的区间声明控制
    open-pull-requests-limit: 5
    # camoufox 0.5.5 要求 playwright<1.61，更高的 playwright 会让
    # all+camoufox 交集为空、test-extras 必红——升级前先等 camoufox 放开
    ignore:
      - dependency-name: playwright
        versions: [">=1.61"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
