name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

# 仅对 PR 取消旧运行（PR 分支会反复推送，取消可避免排队）；
# 推送默认分支不取消——公开仓库的 Actions 分钟数免费，取消节省不了额度，
# 反而会让被顶掉的那次运行在提交列表里留下红色的 cancelled 标记。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: mypy src/web_crawler

  test:
    strategy:
      # 兼容性问题需要完整暴露，单个版本失败不取消其余矩阵项
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          # 项目重度面向 Windows 使用场景，补一个 Windows 验证点
          - os: windows-latest
            python-version: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Run tests with coverage
        run: >
          pytest -m "not slow" --tb=short -q
          --cov=web_crawler
          --cov-fail-under=92
          --cov-report=term-missing

  test-extras:
    # 安装全部可选依赖（playwright / curl_cffi / camoufox 等），把动态 fetcher
    # 与反检测路径纳入覆盖率测量（标准 test job 只装 dev 依赖，相关测试被 skip）
    # mcp extra 必装：MCP 传输层按 SDK 大版本分支（1.x 装饰器 / 2.x 构造回调），
    # 不装就只剩「SDK 未安装」的降级路径被测——2026-10-16 的 2.x 兼容缺陷正是这样
    # 在 CI 里隐形、只在装了 SDK 的本机才炸；这条 extra 让真实 SDK 路径进 CI。
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[all,dev,camoufox,captcha,mcp]"
      - name: Run tests with coverage
        run: >
          pytest -m "not slow" --tb=short -q
          --cov=web_crawler
          --cov-fail-under=97
          --cov-report=term-missing

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Benchmark regression check (advisory)
        id: bench
        # continue-on-error 保留：共享 runner 的 CPU/调度噪声可能造成 >20% 的
        # 假阳性抖动，判定维持 advisory 不挡合并；但结果写 JSON 并上传 artifact，
        # 退化趋势可离线追溯（30 天保留期内可对比多次运行）
        run: python benchmarks.py --check-regression --json-out bench-result.json
        continue-on-error: true
      - name: Surface regression in step summary
        if: always() && steps.bench.outcome == 'failure'
        run: |
          echo "⚠️ **Benchmark regression detected** (advisory — see bench step logs for details)." >> "$GITHUB_STEP_SUMMARY"
      - name: Archive benchmark results
        # bench step 失败（回归 exit 1）时 continue-on-error 保证本步照常执行；
        # JSON 在 exit 前已写盘，故无需 if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-result
          path: bench-result.json
          retention-days: 30

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,docs]"
      - run: mkdocs build --strict
