name: Nightly

on:
  schedule:
    # UTC 18:30（北京时间次日 02:30）——GitHub Actions 共享 runner 的低峰时段，
    # 长时 e2e 排队概率最低；schedule 触发只发生在默认分支
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

# 并发组名以 workflow 名开头（Nightly-…），与 CI 的组（CI-…）天然隔离，
# 夜间任务不会与日间 push/PR 运行互相排队；手动重触发时取消旧的
# nightly，避免 60 分钟级的 e2e 重复占用 runner
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 夜间构建无任何 continue-on-error：任一 job 失败都让本次运行标红，
# 通知依赖 GitHub 默认的 workflow 失败邮件（发送给仓库 watcher/作者），
# 不引入新 secret 或第三方通知服务。
jobs:
  e2e:
    # 全依赖 + 含 slow 的全量测试：仓库仅有的两个 @pytest.mark.slow e2e
    # （tests/test_e2e_reverse_agent.py，真实启动 Camoufox 浏览器跑通
    # ReverseAgent 的 observe→think→act 循环）只在夜间与手动触发时执行，
    # 日间 CI 以 -m "not slow" 排除，保住 PR 反馈速度。
    # 依赖装法与 ci.yml 的 test-extras 对齐（all,dev,camoufox,captcha,mcp），
    # 另补 visual（Pillow）；浏览器二进制需显式下载——test-extras 从不跑
    # slow 测试所以没装过浏览器，这里必须补上。
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[all,dev,camoufox,captcha,mcp,visual]"
      - name: Install browser binaries
        run: |
          playwright install --with-deps chromium
          camoufox fetch
      - name: Run all tests including slow e2e
        # 不带 -m "not slow"：跑全部测试；覆盖率口径与 test-extras 一致
        # （全量依赖档 97），夜间发现的问题必须显式失败而非静默跳过
        run: >
          pytest --tb=short -q
          --cov=web_crawler
          --cov-fail-under=97
          --cov-report=term-missing

  pip-audit:
    # 供应链审计：对 dev 全依赖环境跑 pip-audit（OSV / PyPI Advisory DB），
    # 发现已知漏洞即失败。放夜间而非每次 push——漏洞库更新频率以天计，
    # 日间对同一依赖组合重复审计只会烧 Actions 分钟数。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pip install pip-audit
      # --skip-editable：本地源码包（web-crawler 自身）不是第三方依赖，
      # PyPI 上同名发行版的漏洞记录与本项目无关，跳过以免误报
      - name: Audit installed dependencies
        run: pip-audit --skip-editable
