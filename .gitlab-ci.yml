stages:
  - lint
  - test
  - bench
  - docs

default:
  image: python:3.12-slim
  interruptible: true
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip
  before_script:
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]"

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONPATH: "src"

lint:
  stage: lint
  script:
    - ruff check .
    - ruff format --check .
    - mypy src

test:
  stage: test
  script:
    # Skip @pytest.mark.slow tests (Camoufox e2e suite) in CI; they need a
    # real browser and are too slow for the default pipeline. Run them
    # locally with: pytest -m slow
    - pytest -m "not slow" --cov=web_crawler --cov-report=term --cov-report=xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

bench:
  stage: bench
  script:
    # Fail CI if any benchmark regresses >20% vs the built-in baseline.
    # Baseline values are conservative and only block real regressions.
    - python benchmarks.py --check-regression
  allow_failure: true  # 性能基准受运行环境影响，退化不阻断主流程

docs:
  stage: docs
  before_script:
    - python -m pip install --upgrade pip
    - pip install -e ".[docs]"
  script:
    # Build the MkDocs site in strict mode; broken links / missing references
    # cause the build to fail.
    - mkdocs build --strict
  artifacts:
    paths:
      - site/
    expire_in: 1 week
  allow_failure: true  # 文档构建失败不阻断主流程
