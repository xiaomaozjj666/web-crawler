# Codecov 配置：覆盖率门禁与波动容差
coverage:
  status:
    project:
      default:
        # 项目覆盖率低于 92% 才标红；小幅度自然波动不触发
        target: 92%
        threshold: 1%
    patch:
      default:
        # 补丁覆盖不强制（改动集中在新能力的防御分支上时易误报）
        enabled: false

comment:
  layout: "reach, diff, files"
  behavior: default
  require_changes: false
